name: Build Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Accelerator-Client-Windows
          path: dist/Bilibili Accelerator Client

